<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPT Realism Mod Ammo Graph</title>
    <!-- <script src="./data/data.js"></script> -->
    <script src="./data/data_norm.js"></script>
    <script src="script.js" defer></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #161414;
        color: #168638;
      }
      .caliber-buttons {
        margin-bottom: 20px;
      }
      .caliber-buttons button {
        margin: 5px;
        background-color: #333333;
        color: #ffffff;
        border: none;
        padding: 10px;
        cursor: pointer;
      }
      .caliber-buttons button:hover {
        background-color: #555555;
      }
      .caliber-buttons button.active {
        background-color: #1e88e5;
      }
      #ammoChartContainer {
        width: 1000px;
        height: 800px;
      }
      #ammoChart {
        width: 100%;
        height: 100%;
      }
      #axisSelectContainer {
        margin-bottom: 20px;
      }
      #axisSelectContainer select {
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <div id="ammoChartContainer">
      <div id="axisSelectContainer">
        <label for="y-axis-select">Y-Axis:</label>
        <select id="y-axis-select">
          <option value="PenetrationPower">PenetrationPower</option>
          <option value="ArmorDamage">ArmorDamage</option>
          <option value="ProjectileCount">ProjectileCount</option>
          <option value="Damage">Damage</option>
          <option value="InitialSpeed">InitialSpeed</option>
          <option value="BallisticCoeficient">BallisticCoeficient</option>
          <option value="RicochetChance">RicochetChance</option>
          <option value="FragmentationChance">FragmentationChance</option>
          <option value="BulletMassGram">BulletMassGram</option>
          <option value="HeavyBleedingDelta">HeavyBleedingDelta</option>
          <option value="LightBleedingDelta">LightBleedingDelta</option>
          <option value="ammoAccr">ammoAccr</option>
          <option value="ammoHear">ammoHear</option>
          <option value="ammoRec">ammoRec</option>
          <option value="MalfMisfireChance">MalfMisfireChance</option>
          <option value="MisfireChance">MisfireChance</option>
          <option value="MalfFeedChance">MalfFeedChance</option>
          <option value="DurabilityBurnModificator">
            DurabilityBurnModificator
          </option>
          <option value="HeatFactor">HeatFactor</option>
        </select>
        <label for="x-axis-select">X-Axis:</label>
        <select id="x-axis-select">
          <option value="PenetrationPower">PenetrationPower</option>
          <option value="ArmorDamage">ArmorDamage</option>
          <option value="ProjectileCount">ProjectileCount</option>
          <option value="Damage">Damage</option>
          <option value="InitialSpeed">InitialSpeed</option>
          <option value="BallisticCoeficient">BallisticCoeficient</option>
          <option value="RicochetChance">RicochetChance</option>
          <option value="FragmentationChance">FragmentationChance</option>
          <option value="BulletMassGram">BulletMassGram</option>
          <option value="HeavyBleedingDelta">HeavyBleedingDelta</option>
          <option value="LightBleedingDelta">LightBleedingDelta</option>
          <option value="ammoAccr">ammoAccr</option>
          <option value="ammoHear">ammoHear</option>
          <option value="ammoRec">ammoRec</option>
          <option value="MalfMisfireChance">MalfMisfireChance</option>
          <option value="MisfireChance">MisfireChance</option>
          <option value="MalfFeedChance">MalfFeedChance</option>
          <option value="DurabilityBurnModificator">
            DurabilityBurnModificator
          </option>
          <option value="HeatFactor">HeatFactor</option>
        </select>
        <span>Current Version: SPT 3.11.3 and RM 1.6.1</span>
        <label>
          <input type="checkbox" id="dynamic-scaling-toggle" />
          Dynamic axis scale
        </label>
      </div>
      <div class="caliber-buttons" id="caliberButtons">
          <button id="selectAllBtn">All</button>
          <button id="deselectAllBtn">None</button>
      </div>
      <canvas id="ammoChart"></canvas>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
